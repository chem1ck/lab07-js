<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REST API CRUD | Каталог послуг</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>

  <header class="site-header">
    <nav class="container">
      <div class="logo">SecureDev API</div>
    </nav>
  </header>

  <main class="container">
    <section class="catalog-head">
      <h1>Керування каталогом послуг (CRUD)</h1>
      <button id="add-new-btn" class="btn btn-primary">+ Додати нову послугу</button>
    </section>

    <section class="controls-panel">
      <input type="text" id="search-input" placeholder="Пошук послуги...">
      <select id="category-filter">
        <option value="all">Всі категорії</option>
        <option value="cybersecurity">Кібербезпека</option>
        <option value="development">Розробка</option>
        <option value="consulting">Консалтинг</option>
      </select>
      <select id="sort-select">
        <option value="default">Без сортування</option>
        <option value="price-asc">Ціна (Спочатку дешевші)</option>
        <option value="price-desc">Ціна (Спочатку дорожчі)</option>
      </select>
    </section>

    <section class="catalog-wrapper">
      <div id="ui-loading" class="ui-state hidden"><div class="spinner"></div>Завантаження даних...</div>
      <div id="ui-error" class="ui-state hidden error-message">Помилка з'єднання з сервером API.</div>
      <div id="ui-empty" class="ui-state hidden">Записів не знайдено.</div>
      
      <div id="services-grid" class="services-grid"></div>
    </section>
  </main>

  <div id="form-modal" class="modal hidden">
    <div class="modal-content">
      <button class="close-modal-btn" id="close-form-btn">&times;</button>
      <h2 id="form-title">Додати послугу</h2>
      
      <form id="crud-form" class="contact-form">
        <input type="hidden" id="item-id" name="id">
        
        <div class="form-group">
          <label>Назва послуги *</label>
          <input type="text" id="item-title" name="title" required minlength="3">
        </div>
        
        <div class="form-group">
          <label>Категорія *</label>
          <select id="item-category" name="category" required>
            <option value="cybersecurity">Кібербезпека</option>
            <option value="development">Розробка</option>
            <option value="consulting">Консалтинг</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>Вартість ($) *</label>
          <input type="number" id="item-price" name="price" required min="1">
        </div>

        <div class="form-group">
          <label>Опис *</label>
          <textarea id="item-desc" name="description" rows="3" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">Зберегти</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
