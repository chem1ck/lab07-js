<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакти</title>
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="../styles/responsive.css">
</head>
<body>

  <header class="site-header">
    <div class="header-controls">
      <button class="theme-toggle" aria-label="Змінити тему">🌙</button>
      <button class="burger-btn" aria-expanded="false" aria-label="Відкрити меню">☰</button>
    </div>
    <nav class="container">
      <ul class="nav-list">
        <li><a href="../index.html">Головна</a></li>
        <li><a href="about.html">Про мене</a></li>
        <li><a href="contact.html" class="is-active">Контакти</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section>
      <h1>Зв'яжіться зі мною</h1>
      
      <div class="card">
        <h2>Форма зворотного зв'язку</h2>
        <div class="form-success-block hidden"></div>

        <form id="contact-form" action="#" method="POST" class="contact-form">
          <div class="form-group">
            <label for="name">Ваше ім'я:</label>
            <input type="text" id="name" name="username">
            <span class="error-message"></span>
          </div>
          
          <div class="form-group">
            <label for="email">Ваш Email:</label>
            <input type="text" id="email" name="email">
            <span class="error-message"></span>
          </div>

          <div class="form-group">
            <label for="message">Ваше повідомлення:</label>
            <textarea id="message" name="message" rows="5" maxlength="500"></textarea>
            <span class="char-counter">Введено символів: 0</span>
            <span class="error-message"></span>
          </div>

          <button type="submit" class="btn btn-primary">Надіслати повідомлення</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span class="current-year"></span> Мій перший сайт. Усі права захищено.</p>
  </footer>

  <button class="back-to-top scroll-btn" hidden title="Повернутися вгору">⬆</button>

  <script src="../js/main.js"></script>
</body>
</html>
